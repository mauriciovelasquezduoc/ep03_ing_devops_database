name: Deploy EKS - Database

# ============================================================================
# DEPLOY-ONLY.
# La validación de la imagen (build + Trivy + smoke test de init.sql) la
# ejecuta el workflow "Calidad de código" (calidad-codigo.yml) del mismo repo.
#
# OPCIÓN 1: este workflow se dispara SOLO cuando "Calidad de código" termina
# con éxito (trigger `workflow_run` + gate `conclusion == 'success'`) y
# despliega EL MISMO commit que pasó la calidad (`head_sha`).
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION
#   (GITHUB_TOKEN lo provee GitHub automáticamente)
# ============================================================================

on:
  workflow_run:
    workflows: ["Calidad de código"]
    types: [completed]

env:
  AWS_REGION: us-east-1
  ECR_REPO_DB: ep03-database
  K8S_NAMESPACE: ep03
  DEPLOYMENT_NAME: ep03-database
  NODEGROUP_NAME: laboratorio-ep03-nodegroup

permissions:
  contents: write

jobs:
  # ============================================================
  # JOB 1: VERSIONING — calcula v1.x.0 y crea tag git
  # ============================================================
  versioning:
    name: Versionado Semántico (v1.x.0)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular y crear tag
        id: calc
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v1.*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then
            NEW="v1.0.0"
          else
            MINOR=$(echo "$LAST" | cut -d. -f2)
            NEW="v1.$((MINOR + 1)).0"
          fi
          echo "Último: ${LAST:-ninguno} → Nuevo: $NEW"
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"

  # ============================================================
  # JOB 2: BUILD & PUSH ECR — construye y publica la imagen
  # ============================================================
  build-push-ecr:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    needs: versioning
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build y push con cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_DB }}:${{ needs.versioning.outputs.new_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_DB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen build
        run: |
          echo "### Imagen DB publicada en ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ needs.versioning.outputs.new_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** \`${{ steps.login-ecr.outputs.registry }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repositorio:** \`${{ env.ECR_REPO_DB }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB 3: DEPLOY A EKS — aplica manifiestos y actualiza imagen
  # ============================================================
  deploy:
    name: Deploy a EKS
    runs-on: ubuntu-latest
    needs: [versioning, build-push-ecr]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr-deploy
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deducir variables de EKS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          # Preferir el cluster del episodio actual (ep03). Si no existe,
          # usar el unico cluster disponible y avisar (evita desplegar en un
          # cluster viejo como laboratorio-ep02-eks por orden alfabetico).
          CLUSTER=$(aws eks list-clusters --region "$AWS_REGION" \
            --query "clusters[?contains(@, 'ep03')] | [0]" --output text)
          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
            CLUSTER=$(aws eks list-clusters --region "$AWS_REGION" \
              --query 'clusters[0]' --output text)
            if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
              echo "ERROR: No se encontro ningun cluster EKS en la region $AWS_REGION"
              exit 1
            fi
            echo "ADVERTENCIA: no hay cluster ep03 en la region; usando: $CLUSTER"
          fi
          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"
          echo "  Cluster detectado: $CLUSTER"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configurar kubeconfig
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"
          echo "  Contexto: $(kubectl config current-context)"

      - name: Asegurar nodos Ready (escala el nodegroup si hace falta)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          NODEGROUP_NAME: ${{ env.NODEGROUP_NAME }}
        run: |
          set -euo pipefail
          READY=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2=="Ready"' | wc -l)
          if [ "$READY" -ge 1 ]; then
            echo "  $READY nodo(s) Ready; continuando."
            exit 0
          fi
          echo "  Sin nodos Ready. Escalando nodegroup $NODEGROUP_NAME a desiredSize=1..."
          NG_STATUS=$(aws eks describe-nodegroup \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --nodegroup-name "$NODEGROUP_NAME" \
            --query 'nodegroup.status' --output text 2>/dev/null || echo "NOT-FOUND")
          if [ "$NG_STATUS" = "NOT-FOUND" ]; then
            echo "ERROR: el nodegroup $NODEGROUP_NAME no existe en $EKS_CLUSTER_NAME."
            exit 1
          fi
          echo "  Estado del nodegroup: $NG_STATUS"
          aws eks update-nodegroup-config \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --nodegroup-name "$NODEGROUP_NAME" \
            --scaling-config minSize=1,desiredSize=1,maxSize=3 \
            > /dev/null 2>&1 || true
          echo "  Esperando hasta 15 min a que haya un nodo Ready..."
          for i in $(seq 1 60); do
            READY=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2=="Ready"' | wc -l)
            if [ "$READY" -ge 1 ]; then
              echo "  Nodo Ready tras $((i*15))s."
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: no hubo nodos Ready tras 15 min."
          kubectl get nodes || true
          aws eks describe-nodegroup --cluster-name "$EKS_CLUSTER_NAME" \
            --nodegroup-name "$NODEGROUP_NAME" \
            --query 'nodegroup.{status:status,health:health.issues,scaling:scalingConfig}' --output table || true
          exit 1


      - name: Aplicar manifiestos k8s/
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-deploy.outputs.registry }}
          IMAGE_TAG: ${{ needs.versioning.outputs.new_tag }}
        run: |
          set -euo pipefail
          echo "  Aplicando manifiestos desde k8s/ (instalacion inicial o actualizacion)..."
          echo "  Imagen: ${ECR_REGISTRY}/${ECR_REPO_DB}:${IMAGE_TAG}"
          chmod +x k8s/*.sh
          # El script crea el namespace y el Secret si no existen (idempotente),
          # genera los YAML desde values.yaml + templates/ y los aplica.
          # DATABASE_IMAGE por entorno tiene precedencia sobre values.yaml.
          DATABASE_IMAGE="${ECR_REGISTRY}/${ECR_REPO_DB}:${IMAGE_TAG}" ./k8s/apply.sh

      - name: Rollout del deployment (espera Ready max 5 min)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-deploy.outputs.registry }}
          IMAGE_TAG: ${{ needs.versioning.outputs.new_tag }}
        run: |
          set -euo pipefail
          echo "  Estado actual (deployment / replicaset / pods):"
          kubectl get deploy,rs,pods -n "$K8S_NAMESPACE" -l "app=${ECR_REPO_DB}" -o wide || true
          echo "  Actualizando imagen a $IMAGE_TAG..."
          kubectl set image "deployment/${DEPLOYMENT_NAME}" \
            "database=$ECR_REGISTRY/${ECR_REPO_DB}:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"
          echo "  Esperando rollout (max 5 min)..."
          if ! kubectl rollout status "deployment/${DEPLOYMENT_NAME}" \
                 -n "$K8S_NAMESPACE" --timeout=300s; then
            echo ""
            echo "==========================================================="
            echo "  ERROR: rollout no completo en 5 min. Diagnostico:"
            echo "==========================================================="
            kubectl describe deployment "$DEPLOYMENT_NAME" -n "$K8S_NAMESPACE" || true
            kubectl describe rs -n "$K8S_NAMESPACE" -l "app=${ECR_REPO_DB}" | tail -20 || true
            kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp | tail -15 || true
            exit 1
          fi
          echo "  Rollout completo. Pods:"
          kubectl get pods -n "$K8S_NAMESPACE" -l "app=${ECR_REPO_DB}"

      - name: Verificar estado final
        run: |
          echo ""
          echo "========================================="
          echo " RESUMEN DEL DEPLOY DB"
          echo "========================================="
          echo ""
          echo "--- Pods ---"
          kubectl get pods -n "$K8S_NAMESPACE" -l "app=ep03-database"
          echo ""
          echo "--- Services ---"
          kubectl get svc -n "$K8S_NAMESPACE" -l "app=ep03-database"
          echo ""
          echo "--- Logs (últimas 10 líneas) ---"
          POD=$(kubectl get pods -n "$K8S_NAMESPACE" -l "app=ep03-database" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$POD" ]; then
            kubectl logs "$POD" -n "$K8S_NAMESPACE" --tail=10 2>/dev/null || true
          fi

      - name: Resumen deploy
        if: success()
        run: |
          echo "### Deploy DB completado exitosamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cluster:** \`${{ env.EKS_CLUSTER_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment:** \`${{ env.DEPLOYMENT_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Namespace:** \`${{ env.K8S_NAMESPACE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Versión imagen:** \`${{ env.ECR_REPO_DB }}:${{ needs.versioning.outputs.new_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
